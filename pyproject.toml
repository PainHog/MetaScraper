[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metascraper"
version = "1.0.0"
description = "Catalog metadata from camera video and audio recordings into per-file Word documents and a running master catalog (.docx + .xlsx)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MetaScraper" }]
keywords = ["metadata", "ffprobe", "video", "audio", "catalog", "docx", "xlsx"]
dependencies = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
metascraper = "metascraper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["metascraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
