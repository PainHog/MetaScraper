[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metascraper"
version = "1.1.0"
description = "Catalog and organize metadata from camera video and audio recordings: per-file Word documents, a running master catalog (.docx + .xlsx), and a copy-first library organizer."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MetaScraper" }]
keywords = ["metadata", "ffprobe", "video", "audio", "catalog", "docx", "xlsx", "gui"]
dependencies = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
metascraper = "metascraper.cli:main"

[project.gui-scripts]
# gui-scripts launch without a console window on Windows (uses pythonw).
metascraper-gui = "metascraper.gui:main"

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0"]
build = ["PySide6>=6.5", "pyinstaller>=6.0"]

[tool.setuptools]
packages = ["metascraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
