name: Build Windows App

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries (so the GUI tests run)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
      - name: Install MetaScraper
        run: pip install .[gui,dev]
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Functional smoke (catalog → organize → finalize)
        run: python packaging/functional_smoke.py

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install .[build,dev]
      - name: Install FFmpeg and ExifTool (so real-tool tests run on Windows)
        run: choco install ffmpeg exiftool -y --no-progress
      - name: Tests on Windows (GUI, organizer, real tools with non-English names)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs tests/test_gui.py tests/test_projects.py tests/test_organizer.py tests/test_robustness.py
      - name: Functional smoke on Windows (catalog → organize → finalize)
        run: python packaging/functional_smoke.py
      - name: Build MetaScraper.exe
        run: pyinstaller packaging/MetaScraper.spec
      - name: Smoke-test the built MetaScraper.exe
        run: python packaging/functional_smoke.py --exe dist/MetaScraper.exe
      - name: Upload the .exe as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaScraper-windows
          path: dist/MetaScraper.exe
          if-no-files-found: error
      - name: Attach .exe to the release (on version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MetaScraper.exe
